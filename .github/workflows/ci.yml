name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        preset: [debug, asan]
        include:
          - os: ubuntu-24.04
            preset: tsan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Enter MSVC developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsRoot = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsRoot) { throw 'Visual Studio C++ tools not found' }
          & (Join-Path $vsRoot 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" }
          }
      - name: Install build tools
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python -m pip install cmake ninja
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            .venv/bin/python -m pip install cmake ninja
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --verbose
      - name: Verify simulator replay
        shell: bash
        run: |
          executable="build/${{ matrix.preset }}/quorumkv_tests"
          if [ "$RUNNER_OS" = "Windows" ]; then
            executable="$executable.exe"
          fi
          python scripts/verify_sim_replay.py "$executable" --output "build/${{ matrix.preset }}/Testing/Temporary/sim-replay.txt"
          python scripts/verify_replication_replay.py "$executable" --output "build/${{ matrix.preset }}/Testing/Temporary/replication-replay.txt"
      - name: Verify simulator catches unsafe mutations
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.preset }}" = "debug" ]; then
            extra=(--survey --jobs 2)
          fi
          python scripts/verify_m3_mutations.py "build/${{ matrix.preset }}" --output "build/${{ matrix.preset }}/Testing/Temporary/mutations.jsonl" "${extra[@]}"
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs-${{ matrix.os }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/stacks/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install clang-format==18.1.8 ruff==0.11.13 pytest==8.4.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_format.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/python -q --basetemp=build/pytest

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          python -m venv .venv
          .venv/bin/python -m pip install cmake ninja
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: cmake --preset debug
      - run: python scripts/check_tidy.py --output build/review/clang-tidy.txt
      - name: Save full analysis output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clang-tidy
          path: build/review/clang-tidy.txt
