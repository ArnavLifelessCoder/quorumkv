name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        preset: [debug, asan]
        include:
          - os: ubuntu-24.04
            preset: tsan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install build tools
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python -m pip install cmake ninja
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            .venv/bin/python -m pip install cmake ninja
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --verbose
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.os }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install clang-format==18.1.8 ruff==0.11.13 pytest==8.4.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_format.py
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/python -q --basetemp=build/pytest

  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy
          python -m venv .venv
          .venv/bin/python -m pip install cmake ninja
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: cmake --preset debug
      - run: python scripts/check_tidy.py --output build/review/clang-tidy.txt
      - name: Save full analysis output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clang-tidy
          path: build/review/clang-tidy.txt
